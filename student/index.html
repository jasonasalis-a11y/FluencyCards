<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#166b46"><link rel="manifest" href="/manifest.webmanifest"><title>Fluency Engine</title><style>
:root{--g:#166b46;--bg:#f4f6f5;--line:#d9dfdc;--muted:#68766f}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:var(--bg);color:#18211d}.app{max-width:760px;margin:auto;padding:10px 12px}.brand{font-size:27px;font-weight:900;color:var(--g)}.sub{font-size:14px;color:var(--muted);margin-bottom:8px}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;margin:8px 0}.course{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px;margin:7px 0;font-size:16px}.btn{border:0;border-radius:10px;padding:10px 13px;background:var(--g);color:#fff;font-weight:800;font-size:15px}.btn.secondary{background:#e9efeb;color:#173d2d}.muted{color:var(--muted)}.error{white-space:pre-wrap;color:#8b1e1e}.lesson-shell{height:calc(100dvh - 78px);min-height:460px;display:grid;grid-template-rows:auto auto 1fr auto;gap:7px}.lesson-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.lesson-title{font-size:19px;font-weight:800}.progress{font-size:13px;color:var(--muted)}.card{min-height:0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}.phrase{font-size:clamp(22px,6vw,32px);font-weight:800;text-align:center;margin:5px 0}.native{font-size:clamp(18px,5vw,25px);text-align:center;margin:8px 0;color:#32463d}.prompt{font-size:14px;color:var(--muted);text-align:center}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.controls .btn{padding:11px 6px}.status{font-size:12px;color:var(--muted);text-align:center}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#e8f1ec;color:#165d3f;font-size:12px;font-weight:800}@media(max-height:610px){.brand{font-size:22px}.sub{display:none}.lesson-shell{height:calc(100dvh - 48px)}.card{padding:8px}.phrase{font-size:22px}.native{font-size:18px;margin:4px 0}.btn{padding:8px}}
</style></head><body><main class="app"><div class="brand">Fluency Engine</div><div class="sub">Free, open language learning</div><div id="view" class="panel">Loading catalog…</div></main><script>
const APP_VERSION='0.9.5-beta',view=document.getElementById('view');let course=null,lessonIndex=0,itemIndex=0,currentCourseId='';
const installationId=localStorage.getItem('fe-installation-id')||crypto.randomUUID();localStorage.setItem('fe-installation-id',installationId);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function get(url){const r=await fetch(url);const t=await r.text();let d;try{d=JSON.parse(t)}catch{throw new Error(`Invalid response from ${url}`)}if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}
function title(o){return o?.learning||o?.en||o?.native||o?.kh||''}
function emit(type,extra={}){const event={id:crypto.randomUUID(),installation_id:installationId,type,course_id:currentCourseId,lesson_id:course?.lessons?.[lessonIndex]?.id||'',card_index:itemIndex,created_at:new Date().toISOString(),app_version:APP_VERSION,...extra};const q=JSON.parse(localStorage.getItem('fe-events')||'[]');q.push(event);localStorage.setItem('fe-events',JSON.stringify(q.slice(-200)));flush()}
async function flush(){const q=JSON.parse(localStorage.getItem('fe-events')||'[]');if(!q.length||!navigator.onLine)return;try{const r=await fetch('/api/analytics/batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({events:q})});if(r.ok)localStorage.removeItem('fe-events')}catch{}}
function progressKey(){return`fe-progress:${currentCourseId}`};function saveProgress(){localStorage.setItem(progressKey(),JSON.stringify({lessonIndex,itemIndex,updated_at:new Date().toISOString()}))}
async function catalog(){course=null;view.className='panel';view.innerHTML='Loading catalog…';try{const d=await get('/api/catalog');if(!d.courses.length){view.innerHTML='<h2>No published courses</h2><p class="muted">Publish a complete course from the admin panel. It will appear here automatically.</p>';return}view.innerHTML='<h2>Available courses</h2>'+d.courses.map(c=>`<button class="course" data-id="${esc(c.course_id)}"><b>${esc(c.title_en||c.course_id)}</b><br><span class="muted">${esc(c.title_kh||'')}</span></button>`).join('');view.querySelectorAll('.course').forEach(b=>b.onclick=()=>openCourse(b.dataset.id))}catch(e){view.innerHTML=`<h2>Could not load catalog</h2><div class="error">${esc(e.message)}</div><button class="btn" id="retry">Retry</button>`;retry.onclick=catalog}}
async function openCourse(id){view.textContent='Loading course…';try{currentCourseId=id;course=await get('/api/course/'+encodeURIComponent(id));const p=JSON.parse(localStorage.getItem(progressKey())||'null');lessonIndex=Math.min(p?.lessonIndex||0,course.lessons.length-1);itemIndex=p?.itemIndex||0;renderLesson();emit('course_opened')}catch(e){view.innerHTML=`<div class="error">${esc(e.message)}</div><button class="btn" id="back">Back</button>`;back.onclick=catalog}}
function lessonItems(l){const out=[];if(Array.isArray(l.cards)&&l.cards.length)for(const x of l.cards)out.push({id:x.id,learning:x.learning_text||x.english||x.back?.text,native:x.native_text||x.khmer||x.front?.text,audio:x.audio||x.model_audio,type:x.type||'card'});else if(Array.isArray(l.skills)&&l.skills.length)for(const x of l.skills)out.push({id:x.id,learning:x.learning_text,native:x.native_text,audio:x.model_audio,type:'skill'});if(Array.isArray(l.activities))for(const x of l.activities){if(x.type==='conversation'&&Array.isArray(x.turns)){for(const [i,t] of x.turns.entries())out.push({id:`${x.id}-${i}`,learning:t.learning_text,native:t.native_text,audio:t.audio,type:'conversation',speaker:t.speaker})}else if(x.expected?.text||x.learning_text)out.push({id:x.id,learning:x.expected?.text||x.learning_text,native:x.prompt?.text||x.native_text,audio:x.model_audio,type:x.type||'activity'})}return out}
function renderLesson(){const l=course.lessons[lessonIndex],items=lessonItems(l);itemIndex=Math.min(itemIndex,Math.max(items.length-1,0));const x=items[itemIndex]||{};view.className='lesson-shell';view.innerHTML=`<div class="lesson-head"><button class="btn secondary" id="courses">Courses</button><span class="badge">${esc(x.type||'lesson')}</span></div><div><div class="lesson-title">${esc(title(l.title)||l.id)}</div><div class="progress">Lesson ${lessonIndex+1}/${course.lessons.length} · Item ${Math.min(itemIndex+1,Math.max(items.length,1))}/${Math.max(items.length,1)}</div></div><section class="card"><div class="prompt">${x.speaker?esc(x.speaker):'Listen, understand, and recall'}</div><div class="phrase">${esc(x.learning||'No displayable content')}</div><div class="native">${esc(x.native||'')}</div><div class="status" id="audioStatus">${x.audio?'Audio ready':'No audio reference'}</div></section><div class="controls"><button class="btn secondary" id="prev">← Back</button><button class="btn" id="audio" ${x.audio?'':'disabled'}>🔊 Listen</button><button class="btn" id="next">Next →</button></div>`;courses.onclick=catalog;prev.onclick=()=>{if(itemIndex>0)itemIndex--;else if(lessonIndex>0){lessonIndex--;itemIndex=Math.max(lessonItems(course.lessons[lessonIndex]).length-1,0)}saveProgress();renderLesson()};next.onclick=()=>{if(itemIndex<items.length-1)itemIndex++;else if(lessonIndex<course.lessons.length-1){lessonIndex++;itemIndex=0;emit('lesson_completed')}else{emit('course_completed');alert('Course complete.');return}saveProgress();renderLesson();emit('lesson_opened')};if(x.audio)audio.onclick=async()=>{audioStatus.textContent='Loading audio…';try{const a=new Audio('/media/'+encodeURI(x.audio.replace(/^\//,'')));await a.play();audioStatus.textContent='Playing';emit('audio_played',{audio_path:x.audio});a.onended=()=>audioStatus.textContent='Audio ready'}catch(e){audioStatus.textContent='Audio unavailable';alert(e.message)}};saveProgress()}
catalog();flush();window.addEventListener('online',flush);if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
