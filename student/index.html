<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#166b46"><link rel="manifest" href="/manifest.webmanifest"><title>Fluency Engine</title><style>:root{--g:#166b46;--bg:#f4f6f5;--line:#d9dfdc}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#18211d}.app{max-width:760px;margin:auto;padding:14px}.brand{font-size:30px;font-weight:900;color:var(--g)}.sub{color:#65716b;margin-bottom:16px}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}.course{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin:8px 0;font-size:17px}.btn{border:0;border-radius:10px;padding:11px 14px;background:var(--g);color:#fff;font-weight:800}.muted{color:#68766f}.phrase{font-size:27px;font-weight:800;margin:18px 0 8px}.native{font-size:22px;margin-bottom:18px}.row{display:flex;gap:8px;flex-wrap:wrap}.error{white-space:pre-wrap;color:#8b1e1e}</style></head><body><main class="app"><div class="brand">Fluency Engine</div><div class="sub">Open language learning powered by community courses</div><div id="view" class="panel">Loading catalog…</div></main><script>
const view=document.getElementById('view');let course=null,lessonIndex=0,itemIndex=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function get(url){const r=await fetch(url,{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}
function title(o){return o?.learning||o?.en||o?.native||o?.kh||''}
async function catalog(){try{const d=await get('/api/catalog');if(!d.courses.length){view.innerHTML='<h2>No published courses yet</h2><p class="muted">Import a course in the admin panel, review it, and publish it. It will then appear here.</p>';return}view.innerHTML='<h2>Available courses</h2>'+d.courses.map(c=>`<button class="course" data-id="${esc(c.course_id)}"><b>${esc(c.title_en||c.course_id)}</b><br><span class="muted">${esc(c.title_kh||'')}</span></button>`).join('');view.querySelectorAll('.course').forEach(b=>b.onclick=()=>openCourse(b.dataset.id))}catch(e){view.innerHTML=`<h2>Could not load catalog</h2><div class="error">${esc(e.message)}</div>`}}
async function openCourse(id){view.textContent='Loading course…';try{course=await get('/api/course/'+encodeURIComponent(id));lessonIndex=0;itemIndex=0;renderLesson()}catch(e){view.innerHTML=`<div class="error">${esc(e.message)}</div><button class="btn" onclick="catalog()">Back</button>`}}
function lessonItems(l){if(Array.isArray(l.cards)&&l.cards.length)return l.cards.map(x=>({learning:x.english||x.learning_text,native:x.khmer||x.native_text,audio:x.audio||x.model_audio}));if(Array.isArray(l.skills)&&l.skills.length)return l.skills.map(x=>({learning:x.learning_text,native:x.native_text,audio:x.model_audio}));if(Array.isArray(l.activities)&&l.activities.length)return l.activities.filter(x=>x.learning_text||x.expected?.text||x.prompt?.text).map(x=>({learning:x.learning_text||x.expected?.text,native:x.native_text||x.prompt?.text,audio:x.model_audio}));return []}
function renderLesson(){const l=course.lessons[lessonIndex],items=lessonItems(l),x=items[itemIndex]||{};view.innerHTML=`<button class="btn" id="courses">Courses</button><h2>${esc(title(l.title)||l.id)}</h2><div class="muted">Lesson ${lessonIndex+1} of ${course.lessons.length} · Card ${Math.min(itemIndex+1,Math.max(items.length,1))} of ${Math.max(items.length,1)}</div><div class="card"><div class="phrase">${esc(x.learning||'No displayable cards in this lesson')}</div><div class="native">${esc(x.native||'')}</div><div class="row">${x.audio?'<button class="btn" id="audio">🔊 Listen</button>':''}<button class="btn" id="prev">← Back</button><button class="btn" id="next">Next →</button></div></div>`;courses.onclick=catalog;if(x.audio)audio.onclick=()=>new Audio('/'+x.audio.replace(/^\//,'')).play().catch(()=>alert('Audio asset is not uploaded yet.'));prev.onclick=()=>{if(itemIndex>0)itemIndex--;else if(lessonIndex>0){lessonIndex--;itemIndex=Math.max(lessonItems(course.lessons[lessonIndex]).length-1,0)}renderLesson()};next.onclick=()=>{if(itemIndex<items.length-1)itemIndex++;else if(lessonIndex<course.lessons.length-1){lessonIndex++;itemIndex=0}else return alert('Course complete.');renderLesson()}}
catalog();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
