<!doctype html><html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#166b46"><link rel="manifest" href="manifest.webmanifest"><title>FluencyCards</title>
<style>
:root{--g:#166b46;--bg:#f6f7f4;--line:#ddd;--muted:#666}*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);font-family:Arial,"Noto Sans Khmer",sans-serif;color:#171717;touch-action:pan-x pan-y;overscroll-behavior:none}
.app{max-width:760px;height:100dvh;min-height:100svh;margin:auto;display:flex;flex-direction:column;overflow:hidden}
header{text-align:center;padding:clamp(5px,1.2vh,10px) 12px 4px;flex:0 0 auto}.brand{font-size:clamp(22px,4.5vh,30px);font-weight:900;color:var(--g)}
.moduleline{font-size:21px;font-weight:800;color:var(--g);margin-top:4px}.title{font-size:clamp(22px,4vh,34px);font-weight:900;line-height:1.12;margin-top:2px}.counter{font-size:clamp(14px,2.4vh,20px);color:var(--muted);margin-top:2px}
.topbuttons,nav{display:flex;gap:10px;padding:0 14px 8px}.topbuttons button,nav button{flex:1;font-size:22px;font-weight:800;padding:14px 8px;border-radius:16px;border:1px solid var(--line);background:#fff}
.stage{flex:1 1 auto;min-height:0;display:flex;align-items:stretch;padding:5px 10px;overflow:hidden}.card{width:100%;height:100%;min-height:0;background:#fff;border:1px solid var(--line);border-radius:20px;padding:clamp(10px,2vh,18px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:hidden;touch-action:pan-x}
.icon{font-size:clamp(46px,12vh,88px);line-height:1}.en{font-size:clamp(30px,7.5vh,64px);font-weight:900;margin:clamp(6px,1.5vh,14px) 0;line-height:1.05}.kh{font-size:clamp(23px,5vh,44px);font-weight:700;line-height:1.25}
.btn{border:0;border-radius:999px;background:var(--g);color:#fff;font-size:24px;font-weight:800;padding:14px 20px;margin:7px}.alt{background:#fff;color:var(--g);border:2px solid var(--g)}
nav{padding:10px 14px 18px}nav .next{background:var(--g);color:#fff}.list{width:100%;padding:14px}.item{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:10px 0}.item h2{font-size:28px;margin:0}.item p{font-size:20px;color:var(--muted)}
.status{font-size:19px;color:var(--muted);min-height:26px}.settings{text-align:left;align-items:stretch}.settings select{width:100%;font-size:20px;padding:12px;margin:8px 0 14px;border:1px solid var(--line);border-radius:10px}
.choice{width:100%;text-align:left;font-size:25px;padding:14px;margin:8px 0;border-radius:12px;border:2px solid var(--line);background:#fff}.correct{background:#eaf8f0}.wrong{background:#fdecec}
.conversation{align-items:stretch;justify-content:flex-start;text-align:left;overflow:auto}.role{font-size:20px;font-weight:900;color:var(--g);margin-bottom:4px}.bubble{border-radius:16px;padding:14px;margin:8px 0;background:#f3f6f3}.bubble .line-en{font-size:29px;font-weight:800}.bubble .line-kh{font-size:24px;line-height:1.4;margin-top:5px}.modebuttons{display:flex;gap:8px;width:100%;margin-bottom:10px}.modebuttons button{flex:1}.downloadbar{display:flex;gap:10px;padding:0 14px 8px}.downloadbar button{flex:1;font-size:22px;font-weight:800;padding:14px 8px;border-radius:16px;border:1px solid var(--line);background:var(--g);color:#fff}.downloadbar[hidden],nav[hidden]{display:none!important}.offlinepanel{width:100%;padding:14px;background:#fff;border:1px solid var(--line);border-radius:18px;margin:10px 0}.offlinepanel h2{font-size:27px;margin:0 0 10px}.offlinepanel p{font-size:20px;line-height:1.4;color:var(--muted)}.lessonrow{display:flex;align-items:flex-start;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}.lessonrow input{width:24px;height:24px;margin-top:3px}.lessonrow label{flex:1;font-size:21px;font-weight:700}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eee;font-size:16px;margin-top:6px}.badge.saved{background:#eaf8f0;color:#155d35}.progressbox{font-size:19px;color:var(--muted);min-height:28px;margin-top:8px}
</style></head><body><main class="app">
<header><div class="brand">FluencyCards</div><div id="moduleline" class="moduleline"></div><div id="title" class="title"></div><div id="counter" class="counter"></div></header>
<div class="topbuttons"><button id="home"></button><button id="settings"></button></div>
<div id="downloadbar" class="downloadbar"><button id="offlineManager">⬇ Offline Lessons</button></div>
<section id="stage" class="stage"></section>
<nav id="nav" hidden><button id="back"></button><button id="next" class="next"></button></nav>
</main><script>

const FC_API_BASE=localStorage.getItem("fc-api-base")||"";
const FC_INSTALLATION_ID=localStorage.getItem("fc-installation-id")||crypto.randomUUID();
localStorage.setItem("fc-installation-id",FC_INSTALLATION_ID);
function fcQueueEvent(type,data={}){
  const q=JSON.parse(localStorage.getItem("fc-analytics-queue")||"[]");
  q.push({id:crypto.randomUUID(),type,installation_id:FC_INSTALLATION_ID,created_at:new Date().toISOString(),app_version:"0.9.3",...data});
  localStorage.setItem("fc-analytics-queue",JSON.stringify(q.slice(-1000)));
  fcSyncAnalytics();
}
async function fcSyncAnalytics(){
  if(!FC_API_BASE||!navigator.onLine)return;
  const q=JSON.parse(localStorage.getItem("fc-analytics-queue")||"[]");
  if(!q.length)return;
  try{
    const r=await fetch(FC_API_BASE.replace(/\/$/,"")+"/api/analytics/batch",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({events:q})});
    if(r.ok)localStorage.setItem("fc-analytics-queue","[]");
  }catch(e){}
}
addEventListener("online",fcSyncAnalytics);

let platform,course,module,cards=[],i=0,audio=null,rec=null,chunks=[],blob=null,conversationMode=localStorage.getItem("fc-conversation-mode")||"solo";
const stage=document.getElementById("stage"),title=document.getElementById("title"),moduleline=document.getElementById("moduleline"),counter=document.getElementById("counter"),nav=document.getElementById("nav"),back=document.getElementById("back"),next=document.getElementById("next"),home=document.getElementById("home"),settings=document.getElementById("settings"),downloadbar=document.getElementById("downloadbar"),offlineManager=document.getElementById("offlineManager");
function label(key,fallback){const x=module?.labels?.[key];return x?`${x.kh} (${x.en})`:fallback}
async function fetchJson(url,networkFirst=false){if(networkFirst){try{return await(await fetch(url,{cache:"no-store"})).json()}catch(e){}}return await(await fetch(url)).json()}
async function init(){if("serviceWorker"in navigator){await navigator.serviceWorker.register("service-worker.js");await navigator.serviceWorker.ready}platform=await fetchJson("catalog.json");try{platform=await fetchJson("catalog.json",true)}catch(e){}showCourses()}
function showCourses(){stopAudio();title.textContent="";moduleline.textContent="";counter.textContent="";nav.hidden=true;downloadbar.hidden=false;home.textContent="វគ្គសិក្សា (Courses)";settings.textContent="ការកំណត់ (Settings)";stage.className="list";stage.innerHTML=platform.courses.map(c=>`<button class="item" data-id="${c.id}"><h2>${c.title.kh}</h2><p>${c.title.en}</p></button>`).join("");stage.querySelectorAll(".item").forEach(b=>b.onclick=()=>openCourse(b.dataset.id))}
async function openCourse(id){let e=platform.courses.find(x=>x.id===id);course=await fetchJson(e.catalog,true).catch(()=>fetchJson(e.catalog));title.textContent=`${course.title.kh} (${course.title.en})`;moduleline.textContent="";counter.textContent="";nav.hidden=true;downloadbar.hidden=false;stage.className="list";stage.innerHTML=course.modules.map(m=>`<button class="item" data-id="${m.id}"><h2>${m.title.kh} (${m.title.en})</h2><p>${isModuleSaved(m)?"✓ Saved for offline use":"Not downloaded"}</p></button>`).join("");stage.querySelectorAll(".item").forEach(b=>b.onclick=()=>openModule(b.dataset.id))}
async function openModule(id){fcQueueEvent("lesson_opened",{course_id:course?.course_id||"",lesson_id:id});let e=course.modules.find(x=>x.id===id);module=await(await fetch(e.file)).json();cards=module.cards.map(x=>({...x,type:"phrase"}));module.review.forEach(x=>cards.push({...x,type:"quiz"}));cards.push({type:"conversation"});cards.push({type:"finish"});i=+(localStorage.getItem(id+"i")||0);if(i<0||i>=cards.length)i=0;home.textContent=label("courses_button","Courses");settings.textContent=label("settings_button","Settings");downloadbar.hidden=true;nav.hidden=false;stage.className="stage";stage.innerHTML='<article id="card" class="card"></article>';bindSwipe();render()}
function stopAudio(){if(audio){audio.pause();audio.currentTime=0;audio=null}}
async function play(src,statusId="status"){fcQueueEvent("audio_played",{lesson_id:module?.id||"",card_index:i,src});stopAudio();audio=new Audio(src);try{await audio.play();let s=document.getElementById(statusId);if(s)s.textContent="Repeat."}catch(e){let s=document.getElementById(statusId);if(s)s.textContent=e.message}}
async function startRecord(statusId,playButtonId,recordButtonId,stopButtonId){chunks=[];blob=null;const status=document.getElementById(statusId),mine=document.getElementById(playButtonId),r=document.getElementById(recordButtonId),sbtn=document.getElementById(stopButtonId);try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});let opts={};if(MediaRecorder.isTypeSupported("audio/webm;codecs=opus"))opts.mimeType="audio/webm;codecs=opus";rec=new MediaRecorder(stream,opts);rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{blob=new Blob(chunks,{type:rec.mimeType||"audio/webm"});stream.getTracks().forEach(t=>t.stop());r.hidden=false;sbtn.hidden=true;mine.disabled=!blob.size;status.textContent=blob.size?"Recording ready. Tap My voice to listen.":"No audio was recorded."};rec.start();r.hidden=true;sbtn.hidden=false;mine.disabled=true;status.textContent="Recording… tap Stop when finished."}catch(e){status.textContent="Microphone error: "+e.message}}
function stopRecord(){if(rec&&rec.state==="recording")rec.stop()}
function playMine(){if(!blob)return;let u=URL.createObjectURL(blob),p=new Audio(u);p.onended=()=>URL.revokeObjectURL(u);p.play()}
function header(kind,index,total){moduleline.textContent=`${module.labels.module_label.kh} ${module.module_number} (${module.labels.module_label.en} ${module.module_number}) • ${module.labels.lesson_label.kh} ${module.lesson_number} (${module.labels.lesson_label.en} ${module.lesson_number})`;title.textContent=`${module.title.kh} (${module.title.en})`;counter.textContent=kind==="phrase"?`${module.labels.fluency_card_label.kh} ${index} / ${total} (${module.labels.fluency_card_label.en} ${index} of ${total})`:kind==="conversation"?label("conversation_label","Conversation Practice"):""}
function render(){let el=document.getElementById("card"),c=cards[i],last=i===cards.length-1;back.disabled=i===0&&!last;if(last){back.textContent=label("review_lesson_button","Review Lesson");next.textContent=label("return_to_lessons_button","Return to Lessons")}else{back.textContent="← "+label("back_button","Back");next.textContent=label("next_button","Next")+" →"}
if(c.type==="phrase"){header("phrase",i+1,module.cards.length);el.className="card";el.innerHTML=`<div class="icon">${c.icon}</div><div class="en">${c.english}</div><div class="kh">${c.khmer}</div><div><button id="listen" class="btn">🔊 Listen</button><button id="r" class="btn alt">🎤 Speak</button><button id="stopr" class="btn alt" hidden>■ Stop</button></div><button id="mine" class="btn alt" disabled>▶ My voice</button><div id="status" class="status"></div>`;listen.onclick=()=>play(c.audio);r.onclick=()=>startRecord("status","mine","r","stopr");stopr.onclick=stopRecord;mine.onclick=playMine}
else if(c.type==="quiz"){header("quiz",0,0);el.className="card";el.innerHTML=`<div class="kh">${c.prompt_kh}</div>${c.choices.map((x,n)=>`<button class="choice" data-n="${n}">${x}</button>`).join("")}`;el.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{let n=+b.dataset.n;el.querySelectorAll(".choice").forEach((x,k)=>x.classList.add(k===c.answer?"correct":k===n?"wrong":""))})}
else if(c.type==="conversation"){header("conversation",0,0);renderConversation(el)}
else{header("finish",0,0);el.className="card";el.innerHTML='<div class="icon">🎉</div><div class="en">Excellent work!</div>';counter.textContent=""}
localStorage.setItem(module.id+"i",i)}
function renderConversation(el){el.className="card conversation";el.innerHTML=`<div class="modebuttons"><button id="solo" class="btn ${conversationMode==="solo"?"":"alt"}">${label("solo_mode_label","Practice Alone")}</button><button id="tutor" class="btn ${conversationMode==="tutor"?"":"alt"}">${label("tutor_mode_label","Practice With a Tutor")}</button></div><div id="conversationBody"></div>`;solo.onclick=()=>{conversationMode="solo";localStorage.setItem("fc-conversation-mode",conversationMode);renderConversation(el)};tutor.onclick=()=>{conversationMode="tutor";localStorage.setItem("fc-conversation-mode",conversationMode);renderConversation(el)};let body=document.getElementById("conversationBody");
if(conversationMode==="tutor"){body.innerHTML=module.conversation.map(p=>`<div class="bubble"><div class="role">${label("teacher_label","Teacher")}</div><div class="line-en">${p.teacher.english}</div><div class="line-kh">${p.teacher.khmer}</div><button class="btn playline" data-src="${p.teacher.audio}">🔊 Model</button></div><div class="bubble"><div class="role">${label("student_label","Student")}</div><div class="line-en">${p.student.english}</div><div class="line-kh">${p.student.khmer}</div><button class="btn playline" data-src="${p.student.audio}">🔊 Model</button></div>`).join("");body.querySelectorAll(".playline").forEach(b=>b.onclick=()=>play(b.dataset.src))}
else{body.innerHTML=module.conversation.map((p,n)=>`<div class="bubble"><div class="role">${label("teacher_label","Teacher")}</div><div class="line-en">${p.teacher.english}</div><div class="line-kh">${p.teacher.khmer}</div><button class="btn playline" data-src="${p.teacher.audio}">🔊 Listen</button></div><div class="bubble"><div class="role">${label("student_label","Student")}</div><div class="line-en">${p.student.english}</div><div class="line-kh">${p.student.khmer}</div><button class="btn playline" data-src="${p.student.audio}">🔊 Model</button></div>`).join("");body.querySelectorAll(".playline").forEach(b=>b.onclick=()=>play(b.dataset.src))}
}
function go(d){fcQueueEvent("card_navigated",{lesson_id:module?.id||"",from_index:i,direction:d});let n=i+d;if(n<0||n>=cards.length)return;stopAudio();i=n;render()}
function bindSwipe(){let el=document.getElementById("card"),sx=0,sy=0;el.onpointerdown=e=>{sx=e.clientX;sy=e.clientY};el.onpointerup=e=>{let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.25)(dx<0?go(1):go(-1))}}
function showSettings(){stopAudio();nav.hidden=true;downloadbar.hidden=false;moduleline.textContent="";counter.textContent="";title.textContent=label("settings_button","Settings");stage.className="stage";stage.innerHTML=`<article class="card settings"><h2>${label("conversation_label","Conversation Practice")}</h2><select id="cmode"><option value="solo">${label("solo_mode_label","Practice Alone")}</option><option value="tutor">${label("tutor_mode_label","Practice With a Tutor")}</option></select><button id="save" class="btn">Save</button></article>`;cmode.value=conversationMode;save.onclick=()=>{conversationMode=cmode.value;localStorage.setItem("fc-conversation-mode",conversationMode);showCourses()}}


function isModuleSaved(m){return localStorage.getItem("fc-offline-"+m.id+"-"+(m.version||""))==="1"}
async function showOfflineManager(){
  stopAudio();nav.hidden=true;downloadbar.hidden=true;title.textContent="មេរៀនក្រៅបណ្ដាញ (Offline Lessons)";moduleline.textContent="";counter.textContent="";
  const fresh=await fetchJson("catalog.json",true).catch(()=>platform);platform=fresh;
  const modules=[];
  for(const c of fresh.courses){
    const cc=await fetchJson(c.catalog,true).catch(()=>fetchJson(c.catalog));
    for(const m of cc.modules)modules.push({...m,courseTitle:c.title});
  }
  stage.className="list";
  stage.innerHTML=`<div class="offlinepanel"><h2>Download lessons for offline use</h2><p>Select lessons, or download everything currently available. Open this screen while online to check for newly published lessons.</p><div id="lessonChoices"></div><div class="downloadbar" style="padding:8px 0 0"><button id="selectAll">Select All</button><button id="downloadSelected">Download Selected</button></div><div id="downloadStatus" class="progressbox"></div></div>`;
  const box=document.getElementById("lessonChoices");
  box.innerHTML=modules.map(m=>`<div class="lessonrow"><input type="checkbox" id="dl-${m.id}" data-file="${m.file}" data-id="${m.id}" data-version="${m.version||""}" checked><label for="dl-${m.id}">${m.courseTitle.kh}<br>${m.title.kh} (${m.title.en})<br><span class="badge ${isModuleSaved(m)?"saved":""}">${isModuleSaved(m)?"Saved offline":"Available to download"}</span></label></div>`).join("");
  selectAll.onclick=()=>box.querySelectorAll("input").forEach(x=>x.checked=true);
  downloadSelected.onclick=()=>downloadModules([...box.querySelectorAll("input:checked")].map(x=>({file:x.dataset.file,id:x.dataset.id,version:x.dataset.version})));
}
async function moduleAssets(moduleFile){
  const m=await fetchJson(moduleFile,true).catch(()=>fetchJson(moduleFile));
  const assets=[moduleFile];
  m.cards.forEach(c=>assets.push(c.audio));
  (m.conversation||[]).forEach(p=>{assets.push(p.teacher.audio,p.student.audio)});
  return [...new Set(assets)];
}
async function downloadModules(selected){
  const status=document.getElementById("downloadStatus");
  if(!selected.length){status.textContent="Select at least one lesson.";return}
  status.textContent="Preparing download…";
  const assets=["./","index.html","catalog.json","manifest.webmanifest","icons/icon-192.svg","icons/icon-512.svg"];
  for(const item of selected){
    assets.push(item.file.split("/modules/")[0]+"/catalog.json");
    assets.push(...await moduleAssets(item.file));
  }
  const unique=[...new Set(assets)];
  status.textContent=`Downloading ${unique.length} files…`;
  const controller=navigator.serviceWorker?.controller;
  if(!controller){status.textContent="Reload the app once, then try again.";return}
  const channel=new MessageChannel();
  channel.port1.onmessage=e=>{
    const d=e.data||{};
    if(d.type==="progress")status.textContent=`Downloading ${d.done} of ${d.total}…`;
    if(d.type==="complete"){fcQueueEvent("offline_download_completed",{lesson_count:selected.length});selected.forEach(x=>localStorage.setItem("fc-offline-"+x.id+"-"+x.version,"1"));status.textContent="Download complete. These lessons are now available offline.";setTimeout(showOfflineManager,700)}
    if(d.type==="error")status.textContent="Download failed: "+d.message;
  };
  controller.postMessage({type:"CACHE_ASSETS",assets:unique},[channel.port2]);
}

document.addEventListener("touchmove",e=>{
  if(e.touches&&e.touches.length>1)e.preventDefault();
},{passive:false});
document.addEventListener("gesturestart",e=>e.preventDefault());
document.addEventListener("gesturechange",e=>e.preventDefault());
document.addEventListener("gestureend",e=>e.preventDefault());

back.onclick=()=>{if(i===cards.length-1){i=0;render()}else go(-1)};next.onclick=()=>{if(i===cards.length-1)openCourse(course.course_id);else go(1)};home.onclick=showCourses;settings.onclick=showSettings;offlineManager.onclick=showOfflineManager;init();
</script></body></html><style>@media(max-height:700px){.topbuttons button{padding:7px 5px}.brand{font-size:22px}.card{border-radius:16px}}</style>
