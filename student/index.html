(function warnIfAutoClearBrowser(){

  const bar=document.createElement('div');
  bar.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99998;background:#8a5a00;color:#fff;font:13px/1.4 -apple-system,system-ui,sans-serif;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 6px rgba(0,0,0,.3)';

async function renderStreaks(courseIds){try{const allLessons=[];for(const cid of courseIds){const rows=await idbAllByIndex('lessons','byCourse',IDBKeyRange.only(cid));allLessons.push(...rows.filter(l=>l.passed))}if(!allLessons.length)return;const days=new Set(allLessons.map(l=>(l.passedAt||'').slice(0,10)));let streak=0,d=new Date();for(;;){const key=d.toISOString().slice(0,10);if(days.has(key)){streak++;d.setDate(d.getDate()-1)}else break}const badges=[];if(allLessons.length>=1)badges.push('🏅 First Lesson Passed');if(allLessons.length>=5)badges.push('🎯 Module Complete');if(streak>=7)badges.push('🔥 7-Day Streak');if(streak>=30)badges.push('🔥 30-Day Streak');const box=document.createElement('div');box.className='panel';box.style.marginTop='4px';box.innerHTML=`<b>${streak>0?`🔥 ${streak}-day streak`:'Lessons passed: '+allLessons.length}</b>${badges.length?'<div class=muted style="margin-top:6px">'+badges.join(' &nbsp; ')+'</div>':''}`;view.appendChild(box)}catch(e){}}
function showOfflineScreen(){view.innerHTML=`<h2>You're Offline</h2><p class=muted>No connection, and no course list could be loaded. If you have a previously saved course backup file, restore it below — no internet needed.</p><label class=btn style="display:inline-block;text-align:center">📂 Restore From Saved File<input type=file id=offlineRestoreFile accept=".zip" class=hidden></label><div id=offlineRestoreStatus class=status style="margin-top:8px"></div><div style="margin-top:14px"><button class="btn secondary" id=retryOnline>↻ Try Again</button></div>`;offlineRestoreFile.onchange=async e=>{const f=e.target.files[0];if(!f)return;offlineRestoreStatus.textContent='Restoring…';try{const id=await restoreFromFileStandalone(f);offlineRestoreStatus.textContent='Restored. Opening course…';await openCourse(id)}catch(err){offlineRestoreStatus.textContent='Could not restore: '+err.message}};retryOnline.onclick=catalog}
function activityKind(a){const raw=String(a?.type||'').trim().toLowerCase().replace(/[\s-]+/g,'_');if(raw==='phonics')return'phonics';if(Array.isArray(a?.choices)&&a.choices.length)return'multiple_choice';if(Array.isArray(a?.turns)&&a.turns.length)return'conversation';if(a?.prompt&&a?.expected)return'recall';if(['multiple_choice','multiplechoice','quiz'].includes(raw))return'multiple_choice';if(['conversation','dialogue','dialog'].includes(raw))return'conversation';if(['prompt_speak','recall','speak'].includes(raw))return'recall';return'introduce'}
function flatten(c){const out=[];for(const l of c.lessons||[]){for(const a of [...(l.activities||[]),...(l.assessment||[])]){const kind=activityKind(a),skill=(l.skills||[]).find(x=>x.id===a.skill_ids?.[0])||{},image=skill.image?.r2_key||skill.image?.path||a.image?.r2_key||a.image?.path||null,base={lesson_id:l.id,module_id:l.module_number,skill_ids:a.skill_ids||[]};if(kind==='multiple_choice')out.push({...a,...base,type:'multiple_choice',image,mastery_domain:a.mastery_domain,required_for_mastery:a.required_for_mastery});else if(kind==='recall')out.push({...base,type:'recall',id:a.id,learning:a.expected?.text||a.learning_text||'',native:a.prompt?.text||a.native_text||'',audio:a.model_audio||a.audio||'',mastery_domain:a.mastery_domain,required_for_mastery:a.required_for_mastery,prompt_language:a.prompt_language==='learning'?'learning':'native'});else if(kind==='conversation')out.push({...base,type:'conversation',id:a.id,turns:(a.turns||[]).map(t=>({learning:t.learning_text||'',native:t.native_text||'',audio:t.audio||'',speaker:t.speaker||''})),mastery_domain:a.mastery_domain,required_for_mastery:a.required_for_mastery});else if(kind==='phonics')out.push({...base,type:'phonics',id:a.id,variant:a.variant==='recall'?'recall':'introduce',grapheme:a.grapheme||'',ipa:a.ipa||'',audio:a.model_audio||'',example_learning:a.example_learning_text||'',example_native:a.example_native_text||'',example_audio:a.example_audio||'',mastery_domain:a.mastery_domain||'recall',required_for_mastery:a.required_for_mastery});else out.push({...base,type:'introduce',id:a.id,learning:a.learning_text||'',native:a.native_text||'',audio:a.model_audio||'',image,icon:a.icon||'',recording:Boolean(a.recording),mastery_domain:a.mastery_domain,required_for_mastery:a.required_for_mastery})}}return out}

function audioControls(x,label='🔊 Listen'){return `<div class=audio-row><button class=btn id=audio ${x.audio?'':'disabled'}>${label}</button><label>Speed <select id=speed class=speed><option value=".60">.60</option><option value=".75">.75</option><option value="1.00" selected>1.00</option><option value="1.15">1.15</option></select></label><button class="btn secondary" id=repeat>Repeat ×3</button></div>`}
// ---------- IndexedDB: mastery & review tracking ----------
const DB_NAME='fe-mastery',DB_VERSION=1;
let _dbPromise=null;
function idb(){if(!_dbPromise)_dbPromise=new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('cards')){const s=d.createObjectStore('cards',{keyPath:['courseId','itemId']});s.createIndex('byLesson',['courseId','lessonId']);s.createIndex('byModule',['courseId','moduleId'])}if(!d.objectStoreNames.contains('lessons')){const s2=d.createObjectStore('lessons',{keyPath:['courseId','lessonId']});s2.createIndex('byCourse','courseId')}if(!d.objectStoreNames.contains('moduleReviewSessions'))d.createObjectStore('moduleReviewSessions',{keyPath:['courseId','moduleId','generatedAt']});if(!d.objectStoreNames.contains('lessonMasteryStates'))d.createObjectStore('lessonMasteryStates',{keyPath:['courseId','lessonId']});if(!d.objectStoreNames.contains('flags'))d.createObjectStore('flags',{keyPath:'flagId'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});return _dbPromise}
async function idbGet(store,key){const d=await idb();return new Promise((res,rej)=>{const r=d.transaction(store,'readonly').objectStore(store).get(key);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}
async function idbPut(store,val){const d=await idb();return new Promise((res,rej)=>{const r=d.transaction(store,'readwrite').objectStore(store).put(val);r.onsuccess=()=>res(val);r.onerror=()=>rej(r.error)})}
async function idbAllByIndex(store,index,range){const d=await idb();return new Promise((res,rej)=>{const r=d.transaction(store,'readonly').objectStore(store).index(index).getAll(range);r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
const PASS_RECALL=new Set(['knew','hesitated']),PASS_PRONUNCIATION=new Set(['great','good']);
function recallPassed(memory,pronunciation){return PASS_RECALL.has(memory)&&PASS_PRONUNCIATION.has(pronunciation)}
function isScored(x){return x.type==='multiple_choice'||x.type==='recall'||(x.type==='phonics'&&x.variant==='recall')}
async function recordCardResult(x,{memory,pronunciation,mcCorrect}={}){
  const key=[currentCourseId,x.id];
  let card=await idbGet('cards',key)||{courseId:currentCourseId,itemId:x.id,lessonId:x.lesson_id,moduleId:x.module_id,itemType:x.type,timesSeen:0,timesFailed:0};
  card.timesSeen=(card.timesSeen||0)+1;
  let passed;
  if(x.type==='multiple_choice'){card.mcResult=mcCorrect?'correct':'incorrect';passed=Boolean(mcCorrect)}
  else{card.memory=memory;card.pronunciation=pronunciation;passed=recallPassed(memory,pronunciation)}
  if(!passed)card.timesFailed=(card.timesFailed||0)+1;
  card.lastSeenAt=new Date().toISOString();
  card.masteredAt=passed?(card.masteredAt||card.lastSeenAt):null;
  await idbPut('cards',card);
  await feedMasteryEngine(x,passed);
  return {card,passed};
}
async function lessonScoredCards(lessonId){return (await idbAllByIndex('cards','byLesson',IDBKeyRange.only([currentCourseId,lessonId]))).filter(c=>c.itemType==='multiple_choice'||c.itemType==='recall'||c.itemType==='phonics')}
async function unpassedInLesson(lessonId){return (await lessonScoredCards(lessonId)).filter(c=>!c.masteredAt)}
async function markLessonPassed(lessonId,moduleId){const key=[currentCourseId,lessonId],rec=await idbGet('lessons',key)||{courseId:currentCourseId,lessonId,moduleId,attempts:0};rec.attempts=(rec.attempts||0)+1;rec.passed=true;rec.passedAt=new Date().toISOString();await idbPut('lessons',rec);const state=await getMasteryState(lessonId);if(!state.initial_mastery_at){state.status='mastered';state.initial_mastery_at=rec.passedAt;state.retention_status='verified';state.retraining_queue=[];await saveMasteryState(lessonId,state)}}
// ---------- Mastery engine (mirrors student/mastery-engine.js — keep in sync if either changes) ----------
function meInitialLessonState(lessonId){return{lesson_id:lessonId,status:'in_training',domains:{},skills:{},retraining_queue:[],audit_history:[],initial_mastery_at:null,retention_status:'not_verified'}}
function meRecordAttempt(state,activity,result){const d=activity.mastery_domain||'instruction',go=Boolean(result.go);state.domains[d]||={attempts:0,go:0,no_go:0};state.domains[d].attempts++;state.domains[d][go?'go':'no_go']++;for(const id of activity.skill_ids||[]){state.skills[id]||={attempts:0,current_go:false};const s=state.skills[id];s.attempts++;s.current_go=go;s.last_result=result;if(!go&&!state.retraining_queue.includes(id))state.retraining_queue.push(id);if(go)state.retraining_queue=state.retraining_queue.filter(x=>x!==id)}return state}
function meEvaluateLesson(state,policy){const results={};for(const d of policy.required_domains||[]){const x=state.domains[d]||{attempts:0,go:0},ratio=x.attempts?x.go/x.attempts:0,threshold=policy.go_thresholds?.[d]??1;results[d]={ratio,threshold,go:ratio>=threshold}}const go=(policy.required_domains||[]).every(d=>results[d].go)&&state.retraining_queue.length===0;state.status=go?'mastered':'retraining_required';if(go&&!state.initial_mastery_at){state.initial_mastery_at=new Date().toISOString();state.retention_status='verified'}return{go,domainResults:results,retraining_queue:[...state.retraining_queue]}}
function meGenerateAudit(states,crs,completed){const n=crs.audit_policy?.every_n_lessons||10;if(!completed||completed%n)return null;const c=[];for(const l of crs.lessons||[]){if(!states[l.id]?.initial_mastery_at)continue;for(const s of l.skills||[])c.push({lesson_id:l.id,skill_id:s.id,learning_text:s.learning_text,native_text:s.native_text,model_audio:s.model_audio,retraining_activity_ids:s.retraining_activity_ids||[]})}return c.sort(()=>Math.random()-.5).slice(0,Math.min(crs.audit_policy?.sample_size||20,c.length))}
async function getMasteryState(lessonId){const rec=await idbGet('lessonMasteryStates',[currentCourseId,lessonId]);return rec?.state||meInitialLessonState(lessonId)}
async function saveMasteryState(lessonId,state){await idbPut('lessonMasteryStates',{courseId:currentCourseId,lessonId,state,updatedAt:new Date().toISOString()})}
async function feedMasteryEngine(x,passed){if(!x.lesson_id)return;const state=await getMasteryState(x.lesson_id);meRecordAttempt(state,{mastery_domain:x.mastery_domain,skill_ids:x.skill_ids},{go:passed});await saveMasteryState(x.lesson_id,state)}
async function allPassedLessons(){return (await idbAllByIndex('lessons','byCourse',IDBKeyRange.only(currentCourseId))).filter(l=>l.passed)}
async function allMasteryStatesMap(){const d=await idb();return new Promise((res,rej)=>{const req=d.transaction('lessonMasteryStates','readonly').objectStore('lessonMasteryStates').openCursor(),out={};req.onsuccess=e=>{const cur=e.target.result;if(cur){if(cur.value.courseId===currentCourseId)out[cur.value.lessonId]=cur.value.state;cur.continue()}else res(out)};req.onerror=()=>rej(req.error)})}
// ---------- Review queue state machine ----------
let activeQueue=null; // {items:[...], idx, kind:'lesson'|'module'|'audit', lessonId?, moduleId?}

function unzipStored(b){const v=new DataView(b.buffer,b.byteOffset,b.byteLength),dec=new TextDecoder(),out=[];let p=0;while(p+4<=b.length&&v.getUint32(p,true)===0x04034b50){const method=v.getUint16(p+8,true),size=v.getUint32(p+18,true),nameLen=v.getUint16(p+26,true),extraLen=v.getUint16(p+28,true),name=dec.decode(b.slice(p+30,p+30+nameLen)),start=p+30+nameLen+extraLen;if(method!==0)throw Error('Unsupported course package compression method');out.push({name,bytes:b.slice(start,start+size)});p=start+size}return out}
