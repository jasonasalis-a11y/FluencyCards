<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#166b46"><link rel="manifest" href="/manifest.webmanifest"><title>Fluency Engine</title><style>
:root{--g:#166b46;--bg:#f4f6f5;--line:#d9dfdc;--muted:#68766f}*{box-sizing:border-box}html,body{margin:0;min-height:100%;touch-action:pan-x pan-y;font-family:Arial,sans-serif;background:var(--bg);color:#18211d}.app{max-width:760px;margin:auto;padding:10px 12px calc(18px + env(safe-area-inset-bottom))}.brand{font-size:27px;font-weight:900;color:var(--g)}.sub{font-size:14px;color:var(--muted);margin-bottom:8px}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;margin:8px 0}.course{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px;margin:7px 0;font-size:16px}.btn{border:0;border-radius:10px;padding:10px 13px;background:var(--g);color:#fff;font-weight:800;font-size:15px}.btn.secondary{background:#e9efeb;color:#173d2d}.muted{color:var(--muted)}.lesson-shell{min-height:calc(100dvh - 78px);display:flex;flex-direction:column;gap:8px}.lesson-head{display:flex;align-items:center;justify-content:space-between}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:center;text-align:center;min-height:62dvh;justify-content:center}.card img{width:min(82vw,430px);max-height:38dvh;object-fit:contain;border-radius:14px;margin-bottom:10px}.phrase{font-size:clamp(24px,6vw,34px);font-weight:900;margin:4px}.native{font-family:"Noto Sans Khmer","Khmer OS System",sans-serif;font-size:clamp(23px,6vw,32px);font-weight:800;color:#000;line-height:1.55;margin:5px}.audio-row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:8px}.speed{font-size:14px;padding:8px;border-radius:8px}.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-bottom:max(10px,env(safe-area-inset-bottom))}.choice{width:100%;text-align:left;padding:13px;margin:6px;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:17px}.correct{background:#eaf8f0}.wrong{background:#fdecec}.badge{padding:4px 8px;border-radius:999px;background:#e8f1ec;color:#165d3f;font-size:12px;font-weight:800}.download{margin-left:8px}.status{font-size:12px;color:var(--muted)}
</style></head><body><main class="app"><div class="brand">Fluency Engine</div><div class="sub">Free, open language learning</div><div id="view" class="panel">Loading…</div></main><script>
const APP_VERSION='0.9.6.2',view=document.getElementById('view');let course,courseMeta,items=[],idx=0,currentCourseId='';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function get(u){const r=await fetch(u),t=await r.text();let d;try{d=JSON.parse(t)}catch{throw Error('Invalid response')};if(!r.ok)throw Error(d.error||r.status);return d}
function media(p){return '/media/'+String(p||'').replace(/^\/+/, '')}function installedKey(id){return 'fe-installed:'+id}function progressKey(){return 'fe-progress:'+currentCourseId}
async function catalog(){course=null;const d=await get('/api/catalog');view.className='panel';view.innerHTML='<h2>Courses</h2>'+d.courses.map(c=>{const ins=JSON.parse(localStorage.getItem(installedKey(c.course_id))||'null'),update=ins&&ins.version_label!==c.version_label;return `<button class="course" data-id="${esc(c.course_id)}"><b>${esc(c.title_en)}</b><br><span class=muted>${esc(c.title_kh||'')} · ${esc(c.version_label||'')}</span>${update?'<br><b>Update available</b>':''}</button>`}).join('');view.querySelectorAll('.course').forEach(b=>b.onclick=()=>openCourse(b.dataset.id))}
function flatten(c){const out=[];for(const l of c.lessons||[]){for(const a of l.activities||[]){if(a.type==='introduce'){const s=(l.skills||[]).find(x=>x.id===a.skill_ids?.[0])||{};out.push({type:'introduce',id:a.id,learning:a.learning_text,native:a.native_text,audio:a.model_audio,image:s.image?.r2_key||a.image?.r2_key})}else if(a.type==='multiple_choice')out.push({...a,type:'multiple_choice'});else if(a.type==='prompt_speak')out.push({type:'recall',id:a.id,learning:a.expected?.text,native:a.prompt?.text,audio:a.model_audio});else if(a.type==='conversation')for(const [n,t] of (a.turns||[]).entries())out.push({type:'conversation',id:a.id+'-'+n,learning:t.learning_text,native:t.native_text,audio:t.audio,speaker:t.speaker})}}return out}
async function openCourse(id){currentCourseId=id;courseMeta=(await get('/api/catalog')).courses.find(x=>x.course_id===id);course=await get('/api/course/'+encodeURIComponent(id));items=flatten(course);const p=JSON.parse(localStorage.getItem(progressKey())||'null');idx=Math.min(p?.idx||0,items.length-1);render()}
function render(){const x=items[idx]||{};view.className='lesson-shell';let body='';if(x.type==='multiple_choice'){body=`<div class=native>${esc(x.prompt?.text||'')}</div>${(x.choices||[]).map((c,n)=>`<button class=choice data-n=${n}>${esc(c.text)}</button>`).join('')}`}else body=`${x.image?`<img src="${media(x.image)}" alt="${esc(x.learning)}">`:''}<div class=phrase>${esc(x.learning||'')}</div><div class=native>${esc(x.native||'')}</div><div class=audio-row><button class=btn id=audio ${x.audio?'':'disabled'}>🔊 Listen</button><label>Speed <select id=speed class=speed><option>.60</option><option>.75</option><option selected>1.00</option><option>1.15</option></select></label><button class="btn secondary" id=repeat>Repeat ×3</button></div><div id=st class=status>${x.speaker?esc(x.speaker):''}</div>`;view.innerHTML=`<div class=lesson-head><button class="btn secondary" id=courses>Courses</button><span class=badge>${esc(x.type||'')}</span></div><div><b>${esc(course?.lessons?.[0]?.title?.learning||'Lesson')}</b><div class=muted>Item ${idx+1}/${items.length}</div></div><section class=card id=card>${body}</section><div class=nav><button class="btn secondary" id=prev>← Back</button><button class=btn id=next>Next →</button></div>`;courses.onclick=catalog;prev.onclick=()=>move(-1);next.onclick=()=>move(1);if(x.type==='multiple_choice')view.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{const n=+b.dataset.n;view.querySelectorAll('.choice').forEach((q,k)=>q.classList.add(x.choices[k].correct?'correct':k===n?'wrong':''))});else if(x.audio){const play=async(times=1)=>{for(let i=0;i<times;i++){await new Promise((res,rej)=>{const a=new Audio(media(x.audio));a.playbackRate=Number(speed.value);a.onended=res;a.onerror=rej;a.play().catch(rej)})}};audio.onclick=()=>play(1);repeat.onclick=()=>play(3)};let sx=0;card.ontouchstart=e=>sx=e.changedTouches[0].screenX;card.ontouchend=e=>{const dx=e.changedTouches[0].screenX-sx;if(Math.abs(dx)>55)move(dx<0?1:-1)}}
function move(d){idx=Math.max(0,Math.min(items.length-1,idx+d));localStorage.setItem(progressKey(),JSON.stringify({idx,version:course.version}));render()}
async function downloadCourse(){const urls=[`/api/course/${encodeURIComponent(currentCourseId)}`,...(course.assets?.images||[]).map(x=>media(x.r2_key)),...collectAudio(course).map(media)];const cache=await caches.open('fe-course-'+currentCourseId);let done=0;for(const u of [...new Set(urls)]){const r=await fetch(u);if(!r.ok)throw Error('Download failed: '+u);await cache.put(u,r);done++}localStorage.setItem(installedKey(currentCourseId),JSON.stringify({version_label:course.version,files:done,installed_at:new Date().toISOString()}));alert('Course downloaded for offline use.')}function collectAudio(c){const s=new Set();for(const l of c.lessons||[])for(const a of l.activities||[]){if(a.model_audio)s.add(a.model_audio);for(const t of a.turns||[])if(t.audio)s.add(t.audio)}return [...s]}
catalog();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
</script></body></html>
