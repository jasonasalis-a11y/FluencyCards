<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#166b46"><link rel="manifest" href="/manifest.webmanifest"><title>Fluency Engine</title><style>
:root{--g:#166b46;--bg:#f4f6f5;--line:#d9dfdc;--muted:#68766f}*{box-sizing:border-box}html,body{margin:0;min-height:100%;touch-action:pan-x pan-y;font-family:Arial,sans-serif;background:var(--bg);color:#18211d}.app{max-width:760px;margin:auto;padding:10px 12px calc(12px + env(safe-area-inset-bottom));min-height:100dvh}.app.lesson-mode{height:100dvh;overflow:hidden;display:flex;flex-direction:column;padding-bottom:0}.brand{font-size:27px;font-weight:900;color:var(--g)}.sub{font-size:14px;color:var(--muted);margin-bottom:8px}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;margin:8px 0}.course{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px;margin:7px 0;font-size:16px}.btn{border:0;border-radius:10px;padding:10px 13px;background:var(--g);color:#fff;font-weight:800;font-size:15px}.btn.secondary{background:#e9efeb;color:#173d2d}.muted{color:var(--muted)}.lesson-shell{height:calc(100dvh - 58px);min-height:0;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:7px;overflow:hidden;padding-bottom:max(14px,env(safe-area-inset-bottom))}.lesson-head{display:flex;align-items:center;justify-content:space-between}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex:1 1 auto;min-height:0;overflow:auto;flex-direction:column;align-items:center;text-align:center;justify-content:center}.card img{width:min(82vw,430px);max-height:38dvh;object-fit:contain;border-radius:14px;margin-bottom:10px}.phrase{font-size:clamp(24px,6vw,34px);font-weight:900;margin:4px}.native{font-family:"Noto Sans Khmer","Khmer OS System",sans-serif;font-size:clamp(23px,6vw,32px);font-weight:800;color:#000;line-height:1.55;margin:5px}.audio-row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:8px}.speed{font-size:14px;padding:8px;border-radius:8px}.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px 0 max(10px,env(safe-area-inset-bottom));background:var(--bg);position:relative;z-index:10}.choices{width:100%}.choice{position:relative;z-index:2;touch-action:manipulation;pointer-events:auto;width:100%;text-align:left;padding:13px;margin:6px;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:17px}.choice.selected{outline:3px solid #166b46}.correct{background:#eaf8f0}.wrong{background:#fdecec}.badge{padding:4px 8px;border-radius:999px;background:#e8f1ec;color:#165d3f;font-size:12px;font-weight:800}.download{margin-left:8px}.status{font-size:12px;color:var(--muted)}
.recall-prompt{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}.recall-actions,.rating-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.rating{border:2px solid var(--line);background:#fff;color:#173d2d;border-radius:10px;padding:9px 11px;font-weight:800}.rating.selected{border-color:var(--g);background:#eaf8f0}.answer-box{width:100%;border-top:1px solid var(--line);padding-top:12px;margin-top:8px}.conversation-meta{font-weight:800;color:var(--g);margin-bottom:8px}.conversation-thread{width:100%;display:flex;flex-direction:column;gap:10px;text-align:left;overflow-y:auto}.convo-turn{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fbfcfb}.convo-turn.is-learner{border-color:var(--g);background:#eaf8f0}.convo-turn .phrase{font-size:19px;margin:2px 0;text-align:left}.convo-turn .native{font-size:17px;margin:2px 0 8px;text-align:left}.convo-turn .btn{padding:7px 10px;font-size:13px}.convo-speaker{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px}.convo-icon{font-size:40px;margin-bottom:6px}.intro-record{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:10px}.instruction{font-size:15px;color:#37463f;line-height:1.45}.btn:disabled{opacity:.5;cursor:default}.restore-row{text-align:right;margin:-2px 0 6px}.restore-link{font-size:12px;color:var(--muted);text-decoration:underline;cursor:pointer}.hidden{display:none!important}</style></head><body><main class="app"><div class="brand">Fluency Engine</div><div class="sub">Free, open language learning</div><div id="view" class="panel">Loading…</div></main><script>
const APP_VERSION='0.9.6.9';
const view=document.getElementById('view');
let course,courseMeta,items=[],idx=0,currentCourseId='',sessionRecordingUrl='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showDebugError(msg){let box=document.getElementById('debugError');if(!box){box=document.createElement('div');box.id='debugError';box.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#b00020;color:#fff;font:11px/1.4 monospace;padding:10px;max-height:42vh;overflow:auto;white-space:pre-wrap';const closeBtn=document.createElement('button');closeBtn.textContent='✕ Dismiss';closeBtn.style.cssText='display:block;margin-bottom:6px;background:#fff;color:#b00020;border:0;border-radius:6px;padding:4px 8px;font-weight:800';closeBtn.onclick=()=>box.remove();box.appendChild(closeBtn);document.body.appendChild(box)}const line=document.createElement('div');line.textContent=msg;box.appendChild(line)}
window.addEventListener('error',e=>showDebugError('Error: '+e.message+' @ '+(e.filename||'?')+':'+e.lineno+':'+e.colno));
window.addEventListener('unhandledrejection',e=>showDebugError('Unhandled promise rejection: '+(e.reason&&e.reason.message?e.reason.message:String(e.reason))));
async function get(u){const r=await fetch(u),t=await r.text();let d;try{d=JSON.parse(t)}catch{throw Error('Invalid response')};if(!r.ok)throw Error(d.error||r.status);return d}
function media(p){return '/media/'+String(p||'').replace(/^\/+/, '')}
function installedKey(id){return 'fe-installed:'+id}
function progressKey(){return 'fe-progress:'+currentCourseId}
function isImagePath(p){return /\.(webp|png|jpe?g)$/i.test(p)}
function isAudioPath(p){return /\.(mp3|m4a|ogg|wav)$/i.test(p)}
function imageCacheName(asset){return 'fe-images-'+String(asset?.partition||asset?.sha256||'00').slice(0,2).toLowerCase()}
function audioCacheName(id,ver){return 'fe-audio-'+id+'-'+ver}
async function cacheDeleteEverywhere(url){for(const n of await caches.keys())if(n.startsWith('fe-images-'))await (await caches.open(n)).delete(url)}
async function catalog(){document.querySelector('.app').classList.remove('lesson-mode');course=null;view.className='panel';try{const d=await get('/api/catalog');view.innerHTML='<h2>Courses</h2>'+d.courses.map(c=>{const ins=JSON.parse(localStorage.getItem(installedKey(c.course_id))||'null'),update=ins&&ins.version_label!==c.version_label;return `<button class="course" data-id="${esc(c.course_id)}"><b>${esc(c.title_en)}</b><br><span class=muted>${esc(c.title_kh||'')} · ${esc(c.version_label||'')}</span>${update?'<br><b>Update available</b>':''}</button>`}).join('');view.querySelectorAll('.course').forEach(b=>b.onclick=()=>openCourse(b.dataset.id))}catch(e){showOfflineScreen()}}
function showOfflineScreen(){view.innerHTML=`<h2>You're Offline</h2><p class=muted>No connection, and no course list could be loaded. If you have a previously saved course backup file, restore it below — no internet needed.</p><label class=btn style="display:inline-block;text-align:center">📂 Restore From Saved File<input type=file id=offlineRestoreFile accept=".zip" class=hidden></label><div id=offlineRestoreStatus class=status style="margin-top:8px"></div><div style="margin-top:14px"><button class="btn secondary" id=retryOnline>↻ Try Again</button></div>`;offlineRestoreFile.onchange=async e=>{const f=e.target.files[0];if(!f)return;offlineRestoreStatus.textContent='Restoring…';try{const id=await restoreFromFileStandalone(f);offlineRestoreStatus.textContent='Restored. Opening course…';await openCourse(id)}catch(err){offlineRestoreStatus.textContent='Could not restore: '+err.message}};retryOnline.onclick=catalog}
function activityKind(a){const raw=String(a?.type||'').trim().toLowerCase().replace(/[\s-]+/g,'_');if(Array.isArray(a?.choices)&&a.choices.length)return'multiple_choice';if(Array.isArray(a?.turns)&&a.turns.length)return'conversation';if(a?.prompt&&a?.expected)return'recall';if(['multiple_choice','multiplechoice','quiz'].includes(raw))return'multiple_choice';if(['conversation','dialogue','dialog'].includes(raw))return'conversation';if(['prompt_speak','recall','speak'].includes(raw))return'recall';return'introduce'}
function flatten(c){const out=[];for(const l of c.lessons||[]){for(const a of [...(l.activities||[]),...(l.assessment||[])]){const kind=activityKind(a),skill=(l.skills||[]).find(x=>x.id===a.skill_ids?.[0])||{},image=skill.image?.r2_key||skill.image?.path||a.image?.r2_key||a.image?.path||null;if(kind==='multiple_choice')out.push({...a,type:'multiple_choice',image,mastery_domain:a.mastery_domain,required_for_mastery:a.required_for_mastery});else if(kind==='recall')out.push({type:'recall',id:a.id,learning:a.expected?.text||a.learning_text||'',native:a.prompt?.text||a.native_text||'',audio:a.model_audio||a.audio||'',mastery_domain:a.mastery_domain,required_for_mastery:a.required_for_mastery});else if(kind==='conversation')out.push({type:'conversation',id:a.id,turns:(a.turns||[]).map(t=>({learning:t.learning_text||'',native:t.native_text||'',audio:t.audio||'',speaker:t.speaker||''})),mastery_domain:a.mastery_domain,required_for_mastery:a.required_for_mastery});else out.push({type:'introduce',id:a.id,learning:a.learning_text||'',native:a.native_text||'',audio:a.model_audio||'',image,icon:a.icon||'',recording:Boolean(a.recording),mastery_domain:a.mastery_domain,required_for_mastery:a.required_for_mastery})}}return out}
async function openCourse(id){document.querySelector('.app').classList.add('lesson-mode');currentCourseId=id;try{courseMeta=(await get('/api/catalog')).courses.find(x=>x.course_id===id)}catch(e){courseMeta=null}try{course=await get('/api/course/'+encodeURIComponent(id))}catch(e){view.className='panel';view.innerHTML=`<h2>Course Unavailable Offline</h2><p class=muted>This course isn't downloaded on this device yet, and there's no connection to fetch it now. Connect to the internet, or restore from a saved backup file.</p><label class=btn style="display:inline-block;text-align:center">📂 Restore From Saved File<input type=file id=offlineRestoreFile2 accept=".zip" class=hidden></label><div style="margin-top:14px"><button class="btn secondary" id=backToCourses>← Courses</button></div>`;offlineRestoreFile2.onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const rid=await restoreFromFileStandalone(f);await openCourse(rid)}catch(err){alert('Could not restore: '+err.message)}};backToCourses.onclick=catalog;return}items=flatten(course);const p=JSON.parse(localStorage.getItem(progressKey())||'null');idx=Math.min(p?.idx||0,Math.max(0,items.length-1));render()}
function audioControls(x,label='🔊 Listen'){return `<div class=audio-row><button class=btn id=audio ${x.audio?'':'disabled'}>${label}</button><label>Speed <select id=speed class=speed><option value=".60">.60</option><option value=".75">.75</option><option value="1.00" selected>1.00</option><option value="1.15">1.15</option></select></label><button class="btn secondary" id=repeat>Repeat ×3</button></div>`}
function render(){
 const x=items[idx]||{},last=idx===items.length-1;
 view.className='lesson-shell';let body='';
 if(x.type==='multiple_choice')body=`${x.image?`<img src="${media(x.image)}" alt="Question illustration">`:''}<div class=native>${esc(x.prompt?.text||'')}</div><div class=choices>${(x.choices||[]).map((c,n)=>`<button type=button class=choice data-n="${n}">${esc(c.text)}</button>`).join('')}</div><div id=choiceStatus class=status aria-live=polite></div>`;
 else if(x.type==='recall')body=`<div class=recall-prompt><div class=native>${esc(x.native)}</div><div class=instruction><b>និយាយប្រយោគជាភាសាអង់គ្លេស ហើយថតសំឡេងរបស់អ្នក។</b><br>Say the English sentence, then record yourself.</div><div class=recall-actions><button class=btn id=record>🎤 Record My Answer</button><button class="btn secondary hidden" id=playMine>▶ Play My Recording</button></div><div id=recordStatus class=status></div><button class="btn secondary" id=reveal disabled>Reveal Answer · បង្ហាញចម្លើយ</button><div id=answerBox class="answer-box hidden"><div class=phrase>${esc(x.learning)}</div>${audioControls(x,'🔊 Native English')}<button class="btn secondary" id=playMine2>▶ My Recording</button><div><b>តើអ្នកចាំបានទេ? · Did you remember it?</b><div class=rating-row data-group=memory><button class=rating data-value=knew>ខ្ញុំចាំបាន · I knew it</button><button class=rating data-value=hesitated>ខ្ញុំស្ទាក់ស្ទើរ · I hesitated</button><button class=rating data-value=unknown>ខ្ញុំមិនចាំបាន · I didn't know it</button></div></div><div><b>ការបញ្ចេញសំឡេងរបស់អ្នកយ៉ាងដូចម្តេច? · How was your pronunciation?</b><div class=rating-row data-group=pronunciation><button class=rating data-value=great>ល្អណាស់ · Great</button><button class=rating data-value=good>ល្អ · Good</button><button class=rating data-value=okay>មធ្យម · Okay</button><button class=rating data-value=poor>មិនសូវល្អ · Not so good</button></div></div></div></div>`;
 else if(x.type==='conversation')body=`<div class=conversation-meta>Conversation · ${x.turns.length} turns</div><div class=conversation-thread>${x.turns.map((t,n)=>`<div class="convo-turn ${t.speaker==='learner'?'is-learner':'is-partner'}" data-n="${n}"><div class=convo-speaker>${esc(t.speaker||(n%2?'partner':'learner'))}</div><div class=phrase>${esc(t.learning)}</div><div class=native>${esc(t.native)}</div><button type=button class="btn secondary convo-play" data-n="${n}" ${t.audio?'':'disabled'}>🔊 Listen</button></div>`).join('')}</div><div class=audio-row><label>Speed <select id=speed class=speed><option value=".60">.60</option><option value=".75">.75</option><option value="1.00" selected>1.00</option><option value="1.15">1.15</option></select></label><button class=btn id=playAll ${x.turns.some(t=>t.audio)?'':'disabled'}>▶ Play Whole Conversation</button></div>`;
 else body=`${x.icon?`<div class=convo-icon>${esc(x.icon)}</div>`:''}${x.image?`<img src="${media(x.image)}" alt="${esc(x.learning)}">`:''}<div class=phrase>${esc(x.learning)}</div><div class=native>${esc(x.native)}</div>${audioControls(x)}${x.recording?`<div class=intro-record><button class="btn secondary" id=introRecord>🎤 Record Yourself</button><button class="btn secondary hidden" id=introPlayMine>▶ Play My Recording</button><div id=introRecordStatus class=status></div></div>`:''}`;
 const backLabel=last?'↺ Review lesson':'← Back',nextLabel=last?'Return to lessons':'Next →';
 view.innerHTML=`<div class=lesson-head><button class="btn secondary" id=courses>Courses</button><button class=btn id=download></button><span class=badge>${esc(x.type)}</span></div><div class=restore-row><label class=restore-link>Restore from saved file<input type=file id=restoreFile accept=".zip" class=hidden></label></div><div><b>${esc(course?.lessons?.[0]?.title?.learning||'Lesson')}</b><div class=muted>Item ${idx+1}/${items.length}</div></div><section class=card id=card>${body}</section><div class=nav><button class="btn secondary" id=prev>${backLabel}</button><button class=btn id=next>${nextLabel}</button></div>`;
 courses.onclick=catalog;download.onclick=downloadCourse;restoreFile.onchange=e=>{const f=e.target.files[0];if(f)restoreFromFile(f)};updateDownloadButtonUI();prev.onclick=()=>last?(idx=0,saveProgress(),render()):move(-1);next.onclick=()=>last?catalog():move(1);
 if(x.type==='multiple_choice')wireMultipleChoice(x);else if(x.type==='recall')wireRecall(x);else if(x.type==='conversation')wireConversation(x);else{wireAudio(x);if(x.recording)wireIntroRecording(x)}
 let sx=0,sy=0;card.ontouchstart=e=>{sx=e.changedTouches[0].screenX;sy=e.changedTouches[0].screenY};card.ontouchend=e=>{const dx=e.changedTouches[0].screenX-sx,dy=e.changedTouches[0].screenY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.25)move(dx<0?1:-1)}
}
function wireMultipleChoice(x){const choices=view.querySelector('.choices');choices.addEventListener('click',e=>{const button=e.target.closest('.choice');if(!button)return;const buttons=[...choices.querySelectorAll('.choice')],n=Number(button.dataset.n);buttons.forEach(q=>q.classList.remove('correct','wrong','selected'));buttons.forEach((q,k)=>{if(x.choices[k]?.correct)q.classList.add('correct')});button.classList.add('selected');if(!x.choices[n]?.correct)button.classList.add('wrong');choiceStatus.textContent=x.choices[n]?.correct?'Correct.':'Try again.'})}
function wireAudio(x){if(!x.audio)return;const play=async(times=1)=>{for(let i=0;i<times;i++)await new Promise((res,rej)=>{const a=new Audio(media(x.audio));a.playbackRate=Number(speed.value);a.onended=res;a.onerror=rej;a.play().catch(rej)})};audio.onclick=()=>play(1);repeat.onclick=()=>play(3)}
function wireConversation(x){const thread=view.querySelector('.conversation-thread');const playOne=t=>new Promise((res,rej)=>{if(!t.audio)return res();const a=new Audio(media(t.audio));a.playbackRate=Number(speed.value);a.onended=res;a.onerror=rej;a.play().catch(rej)});thread.addEventListener('click',e=>{const b=e.target.closest('.convo-play');if(!b)return;playOne(x.turns[Number(b.dataset.n)])});playAll.onclick=async()=>{for(const t of x.turns)await playOne(t)}}
function wireIntroRecording(x){let recorder=null,chunks=[],url='';const play=()=>{if(url)new Audio(url).play()};introRecord.onclick=async()=>{if(recorder?.state==='recording'){recorder.stop();introRecord.textContent='Processing…';return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType||'audio/webm'}));introPlayMine.classList.remove('hidden');introRecord.textContent='🎤 Record Again';introRecordStatus.textContent='Recording ready.'};recorder.start();introRecord.textContent='■ Stop Recording';introRecordStatus.textContent='Recording…'}catch(e){introRecordStatus.textContent='Microphone access failed: '+e.message}};introPlayMine.onclick=play}
function wireRecall(x){let recorder=null,chunks=[];const playMineNow=()=>{if(sessionRecordingUrl)new Audio(sessionRecordingUrl).play()};const setRecording=blob=>{if(sessionRecordingUrl)URL.revokeObjectURL(sessionRecordingUrl);sessionRecordingUrl=URL.createObjectURL(blob);playMine.classList.remove('hidden');reveal.disabled=false;record.textContent='🎤 Record Again';recordStatus.textContent='Recording ready. Listen, record again, or reveal the answer.'};record.onclick=async()=>{if(recorder?.state==='recording'){recorder.stop();record.textContent='Processing…';return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());setRecording(new Blob(chunks,{type:recorder.mimeType||'audio/webm'}))};recorder.start();record.textContent='■ Stop Recording';recordStatus.textContent='Recording…'}catch(e){recordStatus.textContent='Microphone access failed: '+e.message}};playMine.onclick=playMineNow;reveal.onclick=()=>{answerBox.classList.remove('hidden');reveal.classList.add('hidden');playMine2.onclick=playMineNow;wireAudio(x)};answerBox.addEventListener('click',e=>{const b=e.target.closest('.rating');if(!b)return;const row=b.closest('.rating-row');row.querySelectorAll('.rating').forEach(q=>q.classList.remove('selected'));b.classList.add('selected');const key='fe-recall:'+currentCourseId+':'+x.id,data=JSON.parse(localStorage.getItem(key)||'{}');data[row.dataset.group]=b.dataset.value;data.updated_at=new Date().toISOString();localStorage.setItem(key,JSON.stringify(data))})}
function saveProgress(){localStorage.setItem(progressKey(),JSON.stringify({idx,version:course.version}))}
function move(d){idx=Math.max(0,Math.min(items.length-1,idx+d));saveProgress();render()}
function downloadButtonState(){const ins=JSON.parse(localStorage.getItem(installedKey(currentCourseId))||'null'),latest=courseMeta?.version_label||course?.version||'';if(ins&&ins.files>0&&ins.version_label===latest)return{label:'✓ Course Up To Date',disabled:true,cls:'btn secondary'};if(ins&&ins.files>0)return{label:'⬆ Update Course',disabled:false,cls:'btn'};return{label:'⬇ Download Full Course',disabled:false,cls:'btn'}}
function updateDownloadButtonUI(){const btn=view.querySelector('#download');if(!btn)return;const s=downloadButtonState();btn.textContent=s.label;btn.disabled=s.disabled;btn.className=s.cls}
async function installPackageBytes(bytes){const entries=await unzipStored(bytes),byName=new Map(entries.map(e=>[e.name,e])),manifestEntry=byName.get('package-manifest.json'),manifest=manifestEntry?JSON.parse(new TextDecoder().decode(manifestEntry.bytes)):{assets:[]},assetMeta=new Map((manifest.assets||[]).map(a=>[a.path,a]));const cjEntry=byName.get('course.json');if(!cjEntry)throw Error('Package is missing course.json');const installedCourse=JSON.parse(new TextDecoder().decode(cjEntry.bytes)),id=installedCourse.course_id;if(!id)throw Error('course.json is missing course_id');const courseCache=await caches.open('fe-course-'+id),audioCache=await caches.open(audioCacheName(id,installedCourse.version));let done=0,imagesReused=0;for(const e of entries){if(e.name==='course.json'){await courseCache.put(`/api/course/${encodeURIComponent(id)}`,new Response(cjEntry.bytes,{headers:{'Content-Type':'application/json'}}));done++;continue}if(e.name==='package-manifest.json')continue;const url=media(e.name),meta=assetMeta.get(e.name)||{};if(isImagePath(e.name)){const cache=await caches.open(imageCacheName(meta)),existing=await caches.match(url);if(existing&&meta.sha256&&existing.headers.get('X-Asset-SHA256')===meta.sha256){imagesReused++;continue}if(existing)await cacheDeleteEverywhere(url);await cache.put(url,new Response(e.bytes,{headers:{'Content-Type':'image/webp','X-Asset-SHA256':meta.sha256||'','X-Asset-ID':meta.asset_id||''}}));done++;continue}if(isAudioPath(e.name)){await audioCache.put(url,new Response(e.bytes));done++;continue}await courseCache.put(url,new Response(e.bytes));done++}localStorage.setItem(installedKey(id),JSON.stringify({version_label:installedCourse.version,asset_revision:installedCourse.asset_revision||0,files:done,images_reused:imagesReused,installed_at:new Date().toISOString()}));if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{});return{installedCourse,done,imagesReused,id}}
function saveBackupFile(bytes,id,version){try{const blob=new Blob([bytes],{type:'application/zip'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`${id}-${version}.zip`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}catch(e){}}
async function downloadCourse(){const latest=courseMeta?.version_label||course?.version||'',ins=JSON.parse(localStorage.getItem(installedKey(currentCourseId))||'null');if(ins&&ins.files>0&&ins.version_label===latest){alert('This course is already up to date.');return}const url=courseMeta?.package_url||`/api/course/${encodeURIComponent(currentCourseId)}/package/${encodeURIComponent(course.version)}`;const r=await fetch(url);if(!r.ok)throw Error('Course package download failed');const bytes=new Uint8Array(await r.arrayBuffer()),{installedCourse,done,imagesReused}=await installPackageBytes(bytes);saveBackupFile(bytes,currentCourseId,installedCourse.version);updateDownloadButtonUI();alert(`Course package installed. ${done} file(s) stored; ${imagesReused} shared image(s) reused. A backup copy was also saved to your device's Downloads folder.`)}
async function restoreFromFile(file){try{const bytes=new Uint8Array(await file.arrayBuffer()),{done,imagesReused}=await installPackageBytes(bytes);updateDownloadButtonUI();alert(`Restored from saved file. ${done} file(s) stored; ${imagesReused} shared image(s) reused.`)}catch(e){alert('Could not restore from that file: '+e.message)}}
async function restoreFromFileStandalone(file){const bytes=new Uint8Array(await file.arrayBuffer()),{id}=await installPackageBytes(bytes);return id}
window.addEventListener('online',async()=>{if(!course){catalog();return}try{courseMeta=(await get('/api/catalog')).courses.find(x=>x.course_id===currentCourseId)||courseMeta;updateDownloadButtonUI()}catch(e){}});
function unzipStored(b){const v=new DataView(b.buffer,b.byteOffset,b.byteLength),dec=new TextDecoder(),out=[];let p=0;while(p+4<=b.length&&v.getUint32(p,true)===0x04034b50){const method=v.getUint16(p+8,true),size=v.getUint32(p+18,true),nameLen=v.getUint16(p+26,true),extraLen=v.getUint16(p+28,true),name=dec.decode(b.slice(p+30,p+30+nameLen)),start=p+30+nameLen+extraLen;if(method!==0)throw Error('Unsupported course package compression method');out.push({name,bytes:b.slice(start,start+size)});p=start+size}return out}
catalog();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
</script></body></html>
