<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>FluencyCards Admin</title>
<style>
:root{--g:#166b46;--bg:#f5f6f3;--line:#d9ddd8;--muted:#68706b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif}.app{max-width:1000px;margin:auto;padding:14px}.brand{font-size:32px;font-weight:900;color:var(--g)}.tabs{display:flex;gap:8px;overflow:auto;margin:12px 0}.tabs button,.btn{border:1px solid var(--line);background:white;border-radius:12px;padding:12px 15px;font-size:17px;font-weight:800}.tabs button.active,.btn.primary{background:var(--g);color:white}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.stat{background:#f1f5f2;border-radius:12px;padding:14px}.stat b{display:block;font-size:28px}.form input,.form select,.form textarea{width:100%;font-size:18px;padding:10px;margin:5px 0 12px;border:1px solid var(--line);border-radius:9px}.form textarea{min-height:110px}.result{white-space:pre-wrap;background:#f3f3f3;padding:12px;border-radius:10px;max-height:55vh;overflow:auto}.small{color:var(--muted);font-size:15px}.hidden{display:none}
</style></head><body><div class="app"><div class="brand">FluencyCards Admin</div><div class="small">Hosted private administration using the protected FluencyCards Admin API.</div>
<div class="tabs"><button data-tab="dashboard" class="active">Dashboard</button><button data-tab="import">Import Course</button><button data-tab="review">AI Review</button><button data-tab="analytics">Analytics</button><button data-tab="settings">Settings</button></div><div id="content"></div></div>
<script>
let tab="dashboard",config={api_base:"",providers:{}},courseDraft=null;
const content=document.getElementById("content");
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));render()});
function apiBase(){return (localStorage.getItem("fc-admin-api")||"").replace(/\/$/,"")}
async function api(path,opts={}){const r=await fetch(apiBase()+path,opts);const d=await r.json();if(!r.ok)throw new Error(d.error||"Request failed");return d}
function render(){({dashboard,importCourse,review,analytics,settings}[tab]||dashboard)()}
async function dashboard(){
 content.innerHTML='<div class="panel"><h2>Loading…</h2></div>';
 try{const d=await api("/api/admin/summary");content.innerHTML=`<div class="panel"><h2>Production summary</h2><div class="grid"><div class="stat"><b>${d.courses}</b>Courses</div><div class="stat"><b>${d.course_versions}</b>Course versions</div><div class="stat"><b>${d.installations}</b>Installations</div><div class="stat"><b>${d.events_30d}</b>Events (30 days)</div></div></div>`}catch(e){content.innerHTML=`<div class="panel"><h2>Connect the API</h2><p>${e.message}</p><p>Open Settings and enter the deployed Worker URL.</p></div>`}
}
function importCourse(){
 content.innerHTML=`<div class="panel form"><h2>Bulk course import</h2><p>Upload a portable FluencyCards course package as JSON. Large courses may contain dozens of lessons generated externally by any LLM.</p><input id="courseFile" type="file" accept=".json,application/json"><button id="validate" class="btn primary">Validate draft</button><div id="importResult" class="result hidden"></div></div>`;
 validate.onclick=async()=>{if(!courseFile.files[0])return;const t=await courseFile.files[0].text();courseDraft=JSON.parse(t);importResult.classList.remove("hidden");importResult.textContent="Validating…";try{const d=await api("/api/admin/course/validate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({course:courseDraft})});importResult.textContent=JSON.stringify(d,null,2);if(d.valid){const b=document.createElement("button");b.className="btn primary";b.textContent="Save as draft";b.onclick=saveDraft;importResult.after(b)}}catch(e){importResult.textContent=e.message}}
}
async function saveDraft(){const d=await api("/api/admin/course/import",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({course:courseDraft})});alert("Draft saved: "+d.version_id)}
function review(){
 content.innerHTML=`<div class="panel form"><h2>Multi-model course review</h2><label>Course version ID<input id="versionId"></label><label>Provider<select id="provider"><option>openrouter</option><option>google</option><option>openai</option><option>compatible</option></select></label><label>Model<input id="model"></label><label>Review focus<textarea id="focus">Review translation accuracy, back-translation consistency, naturalness, register, cultural context, lesson progression, duplicated material, and whether the English phrases are genuinely used in daily life. Return suggestions only.</textarea></label><button id="runReview" class="btn primary">Run review</button><div id="reviewResult" class="result hidden"></div></div>`;
 runReview.onclick=async()=>{reviewResult.classList.remove("hidden");reviewResult.textContent="Reviewing…";try{const d=await api("/api/admin/review",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({version_id:versionId.value,provider:provider.value,model:model.value,focus:focus.value})});reviewResult.textContent=JSON.stringify(d,null,2)}catch(e){reviewResult.textContent=e.message}}
}
async function analytics(){
 content.innerHTML='<div class="panel"><h2>Loading analytics…</h2></div>';
 try{const d=await api("/api/admin/analytics/overview");content.innerHTML=`<div class="panel"><h2>Learning analytics</h2><div class="grid"><div class="stat"><b>${d.active_installations_7d}</b>Active installations (7d)</div><div class="stat"><b>${d.lesson_opens_7d}</b>Lesson opens (7d)</div><div class="stat"><b>${d.audio_plays_7d}</b>Audio plays (7d)</div><div class="stat"><b>${d.offline_downloads_7d}</b>Offline downloads (7d)</div></div><div class="result">${JSON.stringify(d.top_lessons,null,2)}</div></div>`}catch(e){content.innerHTML=`<div class="panel"><h2>Analytics unavailable</h2><p>${e.message}</p></div>`}
}
function settings(){content.innerHTML=`<div class="panel form"><h2>Admin connection</h2><label>Worker API URL<input id="apiUrl" value="${localStorage.getItem("fc-admin-api")||""}" placeholder="https://fluencycards-admin-api.example.workers.dev"></label><button id="save" class="btn primary">Save</button><p class="small">Protect this admin and API with Cloudflare Access. AI provider keys should be stored as Worker secrets, not in this browser.</p></div>`;save.onclick=()=>{localStorage.setItem("fc-admin-api",apiUrl.value);dashboard()}}
render();
</script></body></html>
