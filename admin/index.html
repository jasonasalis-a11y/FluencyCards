<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Fluency Engine Admin</title><style>
:root{--g:#166b46;--bg:#f5f6f3;--line:#d9ddd8;--muted:#68706b;--bad:#9b2525;--ok:#147548}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#17211c}.app{max-width:1050px;margin:auto;padding:12px}.brand{font-size:29px;font-weight:900;color:var(--g)}.small{color:var(--muted);font-size:14px}.tabs{display:flex;gap:7px;overflow:auto;margin:11px 0}.tabs button,.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 13px;font-size:16px;font-weight:800;white-space:nowrap}.tabs button.active,.btn.primary{background:var(--g);color:#fff}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px}.stat{background:#f1f5f2;border-radius:11px;padding:13px}.stat b{display:block;font-size:26px}.form input,.form select,.form textarea{width:100%;font-size:17px;padding:10px;margin:5px 0 11px;border:1px solid var(--line);border-radius:9px}.form textarea{min-height:105px}.result{white-space:pre-wrap;background:#f3f3f3;padding:11px;border-radius:9px;max-height:50vh;overflow:auto}.hidden{display:none}.ok{color:var(--ok)}.bad{color:var(--bad)}.asset{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.row{display:flex;gap:8px;flex-wrap:wrap}.steps{font-weight:800;color:var(--muted)}
</style></head><body><div class="app"><div class="brand">Fluency Engine Admin</div><div class="small">Beta 0.9.5 · D1 metadata · R2 courses and audio</div><div class="tabs"><button data-tab="dashboard" class="active">Dashboard</button><button data-tab="importCourse">Import</button><button data-tab="review">AI Review</button><button data-tab="audio">Audio</button><button data-tab="publish">Validate & Publish</button><button data-tab="analytics">Analytics</button><button data-tab="diagnostics">Diagnostics</button><button data-tab="settings">Settings</button></div><div id="content"></div></div>
<script>
let tab='dashboard',draft=null,lastVersion=localStorage.getItem('fe-last-version')||'';const content=document.getElementById('content');
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});
function base(){return(localStorage.getItem('fc-admin-api')||'').replace(/\/$/,'')}async function api(path,opts={}){const r=await fetch(base()+path,opts);const text=await r.text();let d;try{d=JSON.parse(text)}catch{d={error:text}}if(!r.ok){const e=new Error(d.error||`HTTP ${r.status}`);e.details=d.details;e.body=d;throw e}return d}function showError(el,e){el.textContent=e.message+(e.details?'\n\n'+JSON.stringify(e.details,null,2):'')}
async function versions(selectId='versionId'){const d=await api('/api/admin/course/versions');const s=document.getElementById(selectId);s.innerHTML='<option value="">Select a version</option>'+d.versions.map(v=>`<option value="${v.version_id}" ${v.version_id===lastVersion?'selected':''}>${v.course_id} · ${v.version_label||'draft'} · ${v.status}</option>`).join('');return d}
function render(){({dashboard,importCourse,review,audio,publish,analytics,diagnostics,settings}[tab]||dashboard)()}
async function dashboard(){content.innerHTML='<div class="panel">Loading…</div>';try{const d=await api('/api/admin/summary');content.innerHTML=`<div class="panel"><h2>Production summary</h2><div class="steps">Import → AI Review → Audio → Validate → Publish → Study</div><div class="grid"><div class="stat"><b>${d.courses}</b>Courses</div><div class="stat"><b>${d.course_versions}</b>Versions</div><div class="stat"><b>${d.installations}</b>Installations</div><div class="stat"><b>${d.events_30d}</b>Events (30d)</div></div></div>`}catch(e){content.innerHTML=`<div class="panel"><h2>Admin connection needed</h2><pre class="result">${e.message}</pre><p>Use Settings to enter the admin Worker URL, or leave it blank when this page is served by that Worker.</p></div>`}}
function importCourse(){content.innerHTML=`<div class="panel form"><h2>1. Import course JSON</h2><input id="courseFile" type="file" accept=".json,application/json"><div class="row"><button id="validate" class="btn primary">Validate</button><button id="saveDraft" class="btn" disabled>Save draft to R2</button></div><pre id="out" class="result hidden"></pre></div>`;validate.onclick=async()=>{if(!courseFile.files[0])return alert('Choose a JSON file.');out.classList.remove('hidden');try{draft=JSON.parse(await courseFile.files[0].text());const d=await api('/api/admin/course/validate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({course:draft})});out.textContent=JSON.stringify(d,null,2);saveDraft.disabled=!d.valid}catch(e){showError(out,e)}};saveDraft.onclick=async()=>{out.textContent='Saving to R2…';try{const d=await api('/api/admin/course/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({course:draft})});lastVersion=d.version_id;localStorage.setItem('fe-last-version',lastVersion);out.textContent=JSON.stringify(d,null,2)}catch(e){showError(out,e)}}}
function providerDefaults(p){return p==='google'?'gemini-3.6-flash':p==='openai'?'gpt-5-mini':'google/gemini-3.6-flash'}
async function review(){content.innerHTML=`<div class="panel form"><h2>2. AI Review</h2><label>Course version<select id="versionId"></select></label><label>Provider<select id="provider"><option value="google">Google Gemini</option><option value="openai">OpenAI</option><option value="openrouter">OpenRouter</option></select></label><label>Model<input id="model" value="gemini-3.6-flash"></label><label>Focus<textarea id="focus">Review translation accuracy, back-translation consistency, naturalness, register, cultural context, lesson progression, duplication, and everyday usefulness. Return suggestions only.</textarea></label><button id="run" class="btn primary">Run review</button><pre id="out" class="result hidden"></pre></div>`;await versions();provider.onchange=()=>model.value=providerDefaults(provider.value);run.onclick=async()=>{if(!versionId.value)return alert('Select a version.');out.classList.remove('hidden');out.textContent='Reviewing…';try{const d=await api('/api/admin/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({version_id:versionId.value,provider:provider.value,model:model.value,focus:focus.value})});out.textContent=JSON.stringify(d,null,2)}catch(e){showError(out,e)}}}
async function audio(){content.innerHTML=`<div class="panel form"><h2>3. Audio</h2><label>Course version<select id="versionId"></select></label><div class="row"><button id="scan" class="btn primary">Scan audio</button><button id="downloadManifest" class="btn">Download Edge TTS manifest</button></div><p class="small">Generate all clips with the included Edge TTS tool, or upload human/pre-generated files. Select multiple files at once.</p><input id="audioFiles" type="file" accept="audio/*,.mp3,.wav,.ogg" multiple><button id="upload" class="btn">Upload selected files</button><div id="summary"></div><div id="assets"></div><pre id="out" class="result hidden"></pre></div>`;await versions();let manifest=[];async function doScan(){if(!versionId.value)return alert('Select a version.');const d=await api('/api/admin/audio/status?version_id='+encodeURIComponent(versionId.value));manifest=d.items;summary.innerHTML=`<p><b>${d.present}/${d.total}</b> present · <span class="${d.missing?'bad':'ok'}">${d.missing} missing</span></p>`;assets.innerHTML=d.items.map(x=>`<div class="asset"><div><b>${x.item_id||'audio'}</b><br><span class="small">${x.path}</span><br>${x.text?`<span>${x.text}</span>`:''}</div><div class="${x.present?'ok':'bad'}">${x.present?'✓':'Missing'}</div></div>`).join('')}scan.onclick=doScan;downloadManifest.onclick=async()=>{if(!versionId.value)return alert('Select a version.');const d=await api('/api/admin/audio/manifest?version_id='+encodeURIComponent(versionId.value));const blob=new Blob([JSON.stringify({version_id:d.version_id,course_id:d.course_id,voice:'en-US-GuyNeural',items:d.items},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${d.course_id}-edge-tts-manifest.json`;a.click();URL.revokeObjectURL(a.href)};upload.onclick=async()=>{if(!versionId.value||!audioFiles.files.length)return alert('Select a version and audio files.');const form=new FormData();form.append('version_id',versionId.value);for(const f of audioFiles.files)form.append('files',f,f.name);out.classList.remove('hidden');out.textContent='Uploading…';try{const d=await api('/api/admin/audio/upload',{method:'POST',body:form});out.textContent=JSON.stringify(d,null,2);await doScan()}catch(e){showError(out,e)}}}
async function publish(){content.innerHTML=`<div class="panel form"><h2>4. Final validation and publication</h2><label>Course version<select id="versionId"></select></label><div class="row"><button id="check" class="btn">Check readiness</button><button id="go" class="btn primary">Publish</button></div><pre id="out" class="result hidden"></pre></div>`;await versions();check.onclick=async()=>{out.classList.remove('hidden');try{const d=await api('/api/admin/audio/status?version_id='+encodeURIComponent(versionId.value));out.textContent=JSON.stringify(d,null,2)}catch(e){showError(out,e)}};go.onclick=async()=>{if(!versionId.value)return alert('Select a version.');if(!confirm('Publish this version to the public catalog?'))return;out.classList.remove('hidden');out.textContent='Publishing…';try{const d=await api('/api/admin/course/publish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({version_id:versionId.value})});out.textContent=JSON.stringify(d,null,2)}catch(e){showError(out,e)}}}
async function analytics(){content.innerHTML='<div class="panel">Loading…</div>';try{const d=await api('/api/admin/analytics/overview');content.innerHTML=`<div class="panel"><h2>Analytics</h2><div class="grid"><div class="stat"><b>${d.active_installations_7d}</b>Active (7d)</div><div class="stat"><b>${d.lesson_opens_7d}</b>Lesson opens</div><div class="stat"><b>${d.audio_plays_7d}</b>Audio plays</div><div class="stat"><b>${d.offline_downloads_7d}</b>Offline downloads</div></div><pre class="result">${JSON.stringify(d.top_lessons,null,2)}</pre></div>`}catch(e){content.innerHTML=`<div class="panel"><pre class="result">${e.message}</pre></div>`}}
async function diagnostics(){content.innerHTML='<div class="panel">Loading diagnostics…</div>';try{const d=await api('/api/admin/diagnostics');content.innerHTML=`<div class="panel"><h2>Diagnostics</h2><pre class="result">${JSON.stringify(d,null,2)}</pre><p class="small">The API reports whether secrets exist, never their values.</p></div>`}catch(e){content.innerHTML=`<div class="panel"><pre class="result">${e.message}</pre></div>`}}
function settings(){content.innerHTML=`<div class="panel form"><h2>Settings</h2><label>Admin Worker URL<input id="apiUrl" value="${localStorage.getItem('fc-admin-api')||''}" placeholder="Leave blank for same origin"></label><button id="save" class="btn primary">Save</button><p class="small">Worker secrets: GOOGLE_API_KEY, OPENAI_API_KEY, OPENROUTER_API_KEY. Protect the admin Worker with Cloudflare Access before public use.</p></div>`;save.onclick=()=>{localStorage.setItem('fc-admin-api',apiUrl.value.trim());dashboard()}}
render();
</script></body></html>
